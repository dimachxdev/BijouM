<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<!-- Titre neutre : il est remplace par le nom de la boutique des que la
     fiche est chargee. Aucune marque du logiciel ici — c'est la vitrine de
     la bijouterie, pas la notre. -->
<title>Boutique</title>
<meta name="description" content="" />
<meta name="theme-color" content="#0f0e0c" />
<style>
:root{
  --or:#C9A84C; --or-clair:#e8c96a; --or-fonce:#a8872e;
  --bg:#0f0e0c; --carte:#1c1a17; --carte2:#272420;
  --texte:#f2ecdc; --doux:#9b8d72;
  --bord:rgba(201,168,76,0.16);
  --radius:18px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--bg); color:var(--texte); min-height:100vh;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  line-height:1.55; -webkit-font-smoothing:antialiased;
}
.enveloppe{max-width:560px;margin:0 auto;padding:0 16px 52px}

/* ── Couverture ──────────────────────────────────────────────
   L'image occupe toute la largeur, et se fond dans la page par le bas :
   sans ce degrade, la photo se termine sur une arete nette qui coupe la
   page en deux. */
.couverture{
  position:relative; height:215px; max-width:560px; margin:0 auto;
  background:#17150f center/cover no-repeat;
}
.couverture::after{
  content:''; position:absolute; inset:0;
  background:linear-gradient(to bottom,
    rgba(15,14,12,0.10) 0%, rgba(15,14,12,0.05) 40%,
    rgba(15,14,12,0.55) 78%, var(--bg) 100%);
}
/* Sans photo, surtout pas de repli sur une marque : un simple fond chaud,
   dessine en CSS, qui laisse toute la place au logo. */
.couverture.vide{
  background:
    radial-gradient(120% 95% at 50% 0%, rgba(201,168,76,0.22) 0%, rgba(201,168,76,0) 62%),
    linear-gradient(160deg, #221f18 0%, #17150f 60%, var(--bg) 100%);
  height:155px;
}

/* ── Logo, pose en rond sur la couverture ────────────────── */
.identite{text-align:center;padding:0 16px 22px}
.logo-rond{
  position:relative; z-index:2; width:118px; height:118px;
  margin:-59px auto 16px; border-radius:50%;
  background:#fff; border:4px solid var(--bg);
  box-shadow:0 10px 30px rgba(0,0,0,0.5);
  display:flex; align-items:center; justify-content:center; overflow:hidden;
}
.logo-rond img{width:100%;height:100%;object-fit:contain;padding:9px}
/* Sans logo : l'initiale de la boutique, en or sur fond sombre. Mieux qu'un
   rond vide, et toujours pas une marque empruntee. */
.logo-rond.initiale{
  background:linear-gradient(150deg,#2b2721,#1a1813);
  color:var(--or); font-size:44px; font-weight:600; letter-spacing:1px;
}
.identite h1{font-size:26px;font-weight:600;letter-spacing:-0.3px;line-height:1.28}
.identite .slogan{
  color:var(--or); font-size:14.5px; margin-top:9px; font-style:italic;
  max-width:420px; margin-left:auto; margin-right:auto;
}

/* ── Boutons d'action ────────────────────────────────────── */
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px}
/* Nombre impair d'actions : la derniere prend toute la largeur plutot que
   de laisser un demi-trou a cote d'elle. `:nth-child(odd)` sur le dernier
   enfant ne vaut que si le compte est impair — c'est exactement le cas. */
.actions a:last-child:nth-child(odd){grid-column:1/-1}
.bouton{
  display:flex;align-items:center;justify-content:center;
  padding:14px 12px;border-radius:13px;text-decoration:none;
  font-size:14.5px;font-weight:600;border:1px solid var(--bord);
  background:var(--carte2);color:var(--texte);
  transition:border-color .15s,background .15s,transform .08s;
}
.bouton:active{background:#322e28;transform:scale(0.985)}
/* L'or est plat et porte des lettres NOIRES : du blanc sur cet or tombe a
   1,17:1, invisible sur un telephone en plein jour. Regle du projet. */
.bouton.or{background:var(--or);color:#17150f;border-color:var(--or)}
.bouton.or:active{background:var(--or-fonce)}

/* ── Cartes ──────────────────────────────────────────────── */
.carte{
  background:var(--carte); border:1px solid var(--bord);
  border-radius:var(--radius); padding:20px 20px 21px; margin-top:14px;
}
.carte h2{
  font-size:11px; font-weight:700; letter-spacing:1.4px;
  text-transform:uppercase; color:var(--or); margin-bottom:11px;
}
.carte p{font-size:14.5px;color:var(--texte)}
/* Les horaires arrivent en texte libre, une ligne par jour. On preserve les
   retours a la ligne plutot que d'essayer de les analyser. */
.horaires{white-space:pre-line;font-size:14.5px}
.adresse{font-size:15px;margin-bottom:5px}
.repere{color:var(--doux);font-size:13.5px}

/* ── Reseaux ─────────────────────────────────────────────── */
.reseaux{display:flex;gap:9px;flex-wrap:wrap}
.reseaux a{
  display:inline-flex;align-items:center;gap:7px;
  padding:9px 15px;border-radius:999px;text-decoration:none;
  background:var(--carte2);border:1px solid var(--bord);
  color:var(--texte);font-size:13.5px;
}
.reseaux a:active{background:#322e28}
.reseaux svg{width:16px;height:16px;fill:var(--or);flex-shrink:0}

/* ── Etats ───────────────────────────────────────────────── */
#chargement,#erreur{text-align:center;padding:84px 24px;color:var(--doux)}
#erreur h1{color:var(--texte);font-size:20px;margin-bottom:10px;font-weight:600}
.pied{
  text-align:center;color:var(--doux);font-size:12px;margin-top:32px;
  padding-top:20px;border-top:1px solid var(--bord);
}
</style>
</head>
<body>

<div id="chargement">Chargement…</div>

<div id="erreur" hidden>
  <h1>Boutique introuvable</h1>
  <p>Ce lien ne correspond à aucune boutique. Vérifiez le code ou rapprochez-vous du commerçant.</p>
</div>

<div id="vitrine" hidden>
  <div class="couverture vide" id="v-couverture"></div>

  <div class="identite">
    <div class="logo-rond" id="v-logo"></div>
    <h1 id="v-nom"></h1>
    <div class="slogan" id="v-slogan" hidden></div>
  </div>

  <div class="enveloppe">
    <div class="actions" id="v-actions"></div>

    <div class="carte" id="c-presentation" hidden>
      <h2>À propos</h2>
      <p id="v-presentation"></p>
    </div>

    <div class="carte" id="c-horaires" hidden>
      <h2>Horaires</h2>
      <div class="horaires" id="v-horaires"></div>
    </div>

    <div class="carte" id="c-adresse" hidden>
      <h2>Nous trouver</h2>
      <div class="adresse" id="v-adresse"></div>
      <div class="repere" id="v-repere" hidden></div>
    </div>

    <div class="carte" id="c-reseaux" hidden>
      <h2>Nous suivre</h2>
      <div class="reseaux" id="v-reseaux"></div>
    </div>

    <div class="pied" id="v-pied"></div>
  </div>
</div>

<!-- Pas de security.js ici : cette page n'ecrit jamais dans innerHTML ce qui
     vient de la base, elle passe par textContent. Un fichier de moins a
     charger sur un telephone en donnees mobiles. -->
<script src="js/boutique.js?v=2026-10-31b"></script>
</body>
</html>
